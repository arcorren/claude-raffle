<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Raffle — Big Screen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦞</text></svg>">
<style>
  :root {
    --bg: #1b1917;
    --panel: #242019;
    --edge: #3a352c;
    --ink: #ede6dc;
    --dim: #8a8378;
    --coral: #d97757;
    --coral-bright: #e88b6a;
    --green: #9cae6e;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* terminal chrome */
  .chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--edge);
    flex-shrink: 0;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--edge); }
  .dot.r { background: #c0574f; } .dot.y { background: #c9a554; } .dot.g { background: #7f9c68; }
  .chrome .title { color: var(--dim); font-size: 14px; margin-left: 10px; }

  .cmdline {
    padding: 26px 32px 8px;
    font-size: 22px;
    flex-shrink: 0;
  }
  .cmdline .dollar { color: var(--coral); }
  .cmdline .flag { color: var(--dim); }
  .cmdline .str { color: var(--green); }
  .cursor {
    display: inline-block;
    width: 12px; height: 26px;
    background: var(--coral);
    vertical-align: text-bottom;
    margin-left: 6px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .main {
    flex: 1;
    display: flex;
    gap: 28px;
    padding: 20px 32px 24px;
    min-height: 0;
  }

  /* left rail: QR + count */
  .rail {
    width: 300px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .qrcard {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 22px;
    text-align: center;
  }
  .qrcard .label { color: var(--dim); font-size: 13px; margin-bottom: 14px; letter-spacing: 1px; text-transform: uppercase; }
  #qr { display: inline-block; background: #ede6dc; padding: 12px; border-radius: 8px; }
  #qr img, #qr canvas { display: block; }
  .url { color: var(--coral-bright); font-size: 13px; margin-top: 14px; word-break: break-all; }
  .countcard {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 18px 22px;
    text-align: center;
  }
  .countcard .n { font-size: 64px; font-weight: 700; color: var(--coral); line-height: 1.1; }
  .countcard .label { color: var(--dim); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

  /* the tank: wandering critters */
  .tank {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-width: 0;
  }
  .landmark {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    text-align: center;
  }
  .landmark canvas { image-rendering: pixelated; display: block; margin: 0 auto; }
  .landmark .lm-label {
    color: #6f675c;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 5px;
    white-space: nowrap;
  }
  #forest {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    height: 100%;
    image-rendering: pixelated;
    z-index: 0;
    pointer-events: none;
  }
  #creek {
    position: absolute;
    left: 0; right: 0; top: 52%;
    height: 34px;
    width: 100%;
    image-rendering: pixelated;
    z-index: 0;
    pointer-events: none;
  }
  #creekLabel {
    position: absolute;
    left: 72px; top: calc(52% - 24px);
    z-index: 0;
    color: #6f675c;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    pointer-events: none;
  }
  .critter {
    position: absolute;
    z-index: 1;
    top: 0; left: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    will-change: transform;
    animation: pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .critter canvas {
    image-rendering: pixelated;
    transition: filter 0.3s;
  }
  .critter.newest canvas { filter: drop-shadow(0 0 10px var(--coral-bright)); }
  .critter .tag {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 15px;
    white-space: nowrap;
  }
  .critter.newest .tag { border-color: var(--coral); color: var(--coral-bright); }
  @keyframes pop {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .waiting {
    color: var(--dim);
    font-size: 20px;
    padding-top: 8px;
    margin-left: 72px; /* clear the forest strip on the west edge */
  }

  /* reduced motion: calm static grid */
  body.static .tank {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-content: flex-start;
    overflow-y: auto;
  }
  body.static .critter { position: static; animation: none; }

  .hints {
    flex-shrink: 0;
    padding: 12px 32px;
    border-top: 1px solid var(--edge);
    color: var(--dim);
    font-size: 14px;
    display: flex;
    gap: 28px;
  }
  .hints kbd {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 5px;
    padding: 2px 8px;
    font: inherit;
    color: var(--ink);
  }

  /* draw overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay .status { color: var(--dim); font-size: 20px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 26px; }
  #bigcritter { image-rendering: pixelated; width: 176px; height: 132px; margin-bottom: 10px; }
  .overlay.landed #bigcritter { animation: land 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .bigname {
    font-size: clamp(60px, 11vw, 150px);
    font-weight: 700;
    letter-spacing: -2px;
    text-align: center;
    padding: 0 40px;
    max-width: 100vw;
    overflow: hidden;
    white-space: nowrap;
  }
  .overlay.landed .bigname { color: var(--coral); animation: land 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
  @keyframes land {
    from { transform: scale(0.85); }
    to { transform: scale(1); }
  }
  .overlay .winnerlabel {
    visibility: hidden;
    color: var(--ink);
    font-size: 24px;
    margin-top: 30px;
  }
  .overlay.landed .winnerlabel { visibility: visible; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 11; }

  @media (prefers-reduced-motion: reduce) {
    .cursor, .critter { animation: none; }
  }
</style>
</head>
<body>
  <div class="chrome">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">claude-code-meetup — giveaway — 80×24</span>
  </div>

  <div class="cmdline">
    <span class="dollar">&gt;</span> claude giveaway <span class="flag">--prize</span> <span class="str">"Clawd hat"</span> <span class="flag">--winners</span> 1<span class="cursor"></span>
  </div>

  <div class="main">
    <div class="rail">
      <div class="qrcard">
        <div class="label">Scan to enter</div>
        <div id="qr"></div>
        <div class="url" id="url"></div>
      </div>
      <div class="countcard">
        <div class="n" id="count">0</div>
        <div class="label">in the drawing</div>
      </div>
    </div>
    <div class="tank" id="tank">
      <div class="waiting" id="waiting">waiting for entries<span id="dots">.</span></div>
    </div>
  </div>

  <div class="hints">
    <span><kbd>space</kbd> draw winner</span>
    <span><kbd>r</kbd> draw again</span>
    <span><kbd>esc</kbd> back to the tank</span>
  </div>

  <div class="overlay" id="overlay">
    <div class="status" id="status">selecting winner</div>
    <canvas id="bigcritter"></canvas>
    <div class="bigname" id="bigname"></div>
    <div class="winnerlabel">wins the Clawd hat 🎉</div>
  </div>
  <canvas id="confetti"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous"></script>
<script src="/clawd.js"></script>
<script>
  const tank = document.getElementById('tank');
  const waiting = document.getElementById('waiting');
  const countEl = document.getElementById('count');
  const overlay = document.getElementById('overlay');
  const bignameEl = document.getElementById('bigname');
  const bigcritter = document.getElementById('bigcritter');
  const statusEl = document.getElementById('status');

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) document.body.classList.add('static');

  let names = [];
  let drawing = false;

  // --- QR + config ---
  fetch('/api/config').then(r => r.json()).then(cfg => {
    document.getElementById('url').textContent = cfg.publicUrl.replace(/^https?:\/\//, '');
    new QRCode(document.getElementById('qr'), {
      text: cfg.publicUrl,
      width: 200,
      height: 200,
      colorDark: '#1b1917',
      colorLight: '#ede6dc',
      correctLevel: QRCode.CorrectLevel.M,
    });
  });

  // --- Boulder landmarks (decoration layer under the critters) ---
  function drawGrid(canvas, rows, palette, px) {
    canvas.width = rows[0].length * px;
    canvas.height = rows.length * px;
    const g = canvas.getContext('2d');
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const color = palette[row[x]];
        if (color) { g.fillStyle = color; g.fillRect(x * px, y * px, px, px); }
      }
    });
  }

  function addLandmark(label, canvas, pos, labelColor) {
    const el = document.createElement('div');
    el.className = 'landmark';
    Object.assign(el.style, pos);
    el.appendChild(canvas);
    const tag = document.createElement('div');
    tag.className = 'lm-label';
    tag.textContent = label;
    if (labelColor) tag.style.color = labelColor;
    el.appendChild(tag);
    tank.appendChild(el);
  }

  function drawForest(canvas) {
    // vertical strip of forested foothills along the west edge
    const px = 6, W = 9, H = 140;
    canvas.width = W * px;
    canvas.height = H * px;
    const g = canvas.getContext('2d');
    for (let y = 0; y < H; y++) {
      const ridge = Math.max(2, Math.min(8, Math.round(4 + 2 * Math.sin(y / 7) + 1.5 * Math.sin(y / 3 + 1))));
      for (let x = 0; x < ridge; x++) {
        let color = x < ridge - 2 ? '#39412f' : '#46503a';
        if ((x * 13 + y * 7) % 11 === 0) color = '#2f362a';
        g.fillStyle = color;
        g.fillRect(x * px, y * px, px, px);
      }
    }
  }

  function drawFlatirons(canvas) {
    const px = 6, W = 38, H = 13;
    canvas.width = W * px;
    canvas.height = H * px;
    const g = canvas.getContext('2d');
    // slabs lean like the real ones: steep west edge, long east face sloping to the plains
    const slabs = [{ ax: 2, ay: 0 }, { ax: 13, ay: 1 }, { ax: 24, ay: 3 }];
    slabs.forEach(({ ax, ay }) => {
      for (let y = ay; y < H; y++) {
        const rel = y - ay;
        const x0 = ax - Math.round(rel * 0.3);
        const x1 = ax + Math.round(rel * 1.35);
        for (let x = Math.max(0, x0); x <= Math.min(W - 1, x1); x++) {
          g.fillStyle = x - x0 < 2 ? '#5d5142' : '#7d6b54';
          g.fillRect(x * px, y * px, px, px);
        }
      }
    });
  }

  function drawCreek(canvas) {
    const px = 6, W = 220, H = 6;
    canvas.width = W * px;
    canvas.height = H * px;
    const g = canvas.getContext('2d');
    for (let x = 0; x < W; x++) {
      const top = Math.round(1.4 + Math.sin(x / 8) * 1.3);
      for (let y = Math.max(0, top); y < H; y++) {
        g.fillStyle = (x * 7 + y * 13) % 19 === 0 ? '#6d8fa0' : '#4f6d7d';
        g.fillRect(x * px, y * px, px, px);
      }
    }
  }

  function buildLandmarks() {
    // map-ish layout, north up / west left: Flatirons southwest, Chautauqua's
    // meadow at their base, the creek east-west through town, Pearl just north
    // of the creek, Natural Grocers out east on 30th.
    const forest = document.createElement('canvas');
    forest.id = 'forest';
    drawForest(forest);
    tank.appendChild(forest);

    const flat = document.createElement('canvas');
    drawFlatirons(flat);
    addLandmark('the flatirons', flat, { left: '5%', bottom: '6%' });

    const chaut = document.createElement('canvas');
    drawGrid(chaut, [
      '....t........t....',
      '...ttt......ttt...',
      '..ttttt....ttttt..',
      '....k........k....',
      'mmmmmmmmmmmmmmmmmm',
      'mmmmmmmmmmmmmmmmmm',
      '.mmmmmmmmmmmmmmmm.',
    ], { t: '#46573c', k: '#5a4632', m: '#5e6b4a' }, 5);
    addLandmark('chautauqua', chaut, { left: '25%', bottom: '9%' });

    const pearl = document.createElement('canvas');
    drawGrid(pearl, [
      'bbbbbbbbb.cccccccc..',
      'bbbbbbbbb.cccccccc..',
      'aAaAaAaAa.eAeAeAeA..',
      'bddbddbbb.cddcddcc..',
      'bddbddbbb.cddcddcc..',
      'bbbbbbbbb.cccccccc..',
      'pqpqpqpqpqpqpqpqpqpq',
      'qpqpqpqpqpqpqpqpqpqp',
    ], {
      b: '#8a6a52', c: '#7d7264', d: '#3a322a',
      a: '#a05a48', A: '#cbbfa8', e: '#5f6f50',
      p: '#6b4a3a', q: '#5a3f31',
    }, 6);
    addLandmark('pearl street', pearl, { left: '28%', top: '26%' });

    const ng = document.createElement('canvas');
    drawGrid(ng, [
      '.ssssssssssss.',
      '.ssssssssssss.',
      '.wwwwwwwwwwww.',
      '.wddgdwwddddw.',
      '.wddcdwwddddw.',
      '.wddcdwwddddw.',
      '.wwwwwwwwwwww.',
    ], { s: '#b5442d', w: '#a89a80', d: '#3a322a', c: '#d97757', g: '#5f6f50' }, 5);
    addLandmark('natural grocers', ng, { left: '62%', top: '30%' });

    const cu = document.createElement('canvas');
    drawGrid(cu, [
      '..........rr..........',
      '.........rrrr.........',
      '.........ssss.........',
      'rrrrrrrrrssssrrrrrrrrr',
      'ssssssssssssssssssssss',
      'sddsddsddsddsddsddsdds',
      'ssssssssssddssssssssss',
      'ssssssssssssssssssssss',
    ], { r: '#9c5540', s: '#b89b72', d: '#3a322a' }, 6);
    addLandmark('cu boulder', cu, { left: '36%', bottom: '22%' });

    const meetup = document.createElement('canvas');
    drawGrid(meetup, [
      'cccccccccccccccc',
      'wwwwwwwwwwwwwwww',
      'wddddddwwddwwddw',
      'wddddddwwddwwddw',
      'wddddddwwwwwwwww',
      'wwwwwwwwwwwwwwww',
    ], { c: '#d97757', w: '#8a7a68', d: '#3a322a' }, 5);
    addLandmark('claude code meetup', meetup, { left: '84%', top: '60%' }, '#a3705a');

    const creek = document.createElement('canvas');
    creek.id = 'creek';
    drawCreek(creek);
    tank.appendChild(creek);
    const creekLabel = document.createElement('div');
    creekLabel.id = 'creekLabel';
    creekLabel.textContent = 'boulder creek';
    tank.appendChild(creekLabel);
  }
  buildLandmarks();

  // waiting dots
  setInterval(() => {
    const d = document.getElementById('dots');
    if (d) d.textContent = '.'.repeat((d.textContent.length % 3) + 1);
  }, 500);

  // --- the tank: one wandering Clawd per entrant ---
  const critters = new Map(); // name -> critter state

  const looks = new Map(); // name -> chosen look (or null)

  function addCritter(name, isNew) {
    const el = document.createElement('div');
    el.className = 'critter';
    const canvas = document.createElement('canvas');
    const v = Clawd.drawVariant(canvas, Clawd.variantWithLook(name, looks.get(name)), 4);
    canvas.style.width = Math.round(64 * v.size) + 'px';
    canvas.style.height = Math.round(48 * v.size) + 'px';
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = name;
    el.appendChild(canvas);
    el.appendChild(tag);
    if (isNew) {
      el.classList.add('newest');
      setTimeout(() => el.classList.remove('newest'), 2500);
    }
    tank.appendChild(el);

    const w = el.offsetWidth || 90;
    const h = el.offsetHeight || 80;
    const c = {
      el, canvas, w, h,
      x: Math.random() * Math.max(1, tank.clientWidth - w),
      y: Math.random() * Math.max(1, tank.clientHeight - h),
      tx: 0, ty: 0,
      speed: 0,
      pauseUntil: performance.now() + Math.random() * 2000,
      manualUntil: 0,
      facing: 1,
    };
    c.tx = c.x; c.ty = c.y;
    if (!reducedMotion) {
      el.style.transform = `translate(${c.x}px, ${c.y}px)`;
    }
    critters.set(name, c);
  }

  function renderTank(entryList) {
    const prev = new Set(names);
    const hadAny = names.length > 0;
    names = entryList.map((e) => e.name);
    countEl.textContent = names.length;
    waiting.style.display = names.length ? 'none' : 'block';

    const incoming = new Set(names);
    for (const [name, c] of critters) {
      if (!incoming.has(name)) { c.el.remove(); critters.delete(name); }
    }
    entryList.forEach(({ name, look }) => {
      const key = JSON.stringify(look || null);
      looks.set(name, look || null);
      const existing = critters.get(name);
      if (!existing) {
        addCritter(name, hadAny && !prev.has(name));
        critters.get(name).lookKey = key;
      } else if (existing.lookKey !== key) {
        // wardrobe change from the phone — redraw in place
        Clawd.drawVariant(existing.canvas, Clawd.variantWithLook(name, look), 4);
        existing.lookKey = key;
      }
    });
    for (const name of looks.keys()) if (!incoming.has(name)) looks.delete(name);
  }

  function pickTarget(c, now) {
    const maxX = Math.max(0, tank.clientWidth - c.w);
    const maxY = Math.max(0, tank.clientHeight - c.h);
    // amble somewhere nearby; occasionally scuttle fast and far
    const scuttle = Math.random() < 0.18;
    const range = scuttle ? 500 : 160;
    c.tx = Math.min(maxX, Math.max(0, c.x + (Math.random() - 0.5) * 2 * range));
    c.ty = Math.min(maxY, Math.max(0, c.y + (Math.random() - 0.5) * 2 * range));
    c.speed = scuttle ? 150 : 22 + Math.random() * 22;
    if (Math.abs(c.tx - c.x) > 2) c.facing = c.tx > c.x ? 1 : -1;
  }

  let lastFrame = performance.now();
  function wanderLoop(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.1);
    lastFrame = now;
    for (const c of critters.values()) {
      if (now < c.pauseUntil) continue;
      const dx = c.tx - c.x, dy = c.ty - c.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 2) {
        if (now < c.manualUntil) {
          // being driven from a phone: hold still, wait for the next command
          c.pauseUntil = now + 250;
        } else {
          c.pauseUntil = now + 600 + Math.random() * 2600;
          pickTarget(c, now);
        }
        continue;
      }
      const step = Math.min(c.speed * dt, dist);
      c.x += (dx / dist) * step;
      c.y += (dy / dist) * step;
      c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
      c.canvas.style.transform = c.facing === -1 ? 'scaleX(-1)' : '';
    }
    requestAnimationFrame(wanderLoop);
  }
  if (!reducedMotion) requestAnimationFrame(wanderLoop);

  // keep critters inside on resize
  addEventListener('resize', () => {
    for (const c of critters.values()) {
      c.x = Math.min(c.x, Math.max(0, tank.clientWidth - c.w));
      c.y = Math.min(c.y, Math.max(0, tank.clientHeight - c.h));
    }
  });

  // --- SSE ---
  function connect() {
    const es = new EventSource('/api/events');
    es.addEventListener('entries', (e) => {
      const data = JSON.parse(e.data);
      renderTank(data.entries || (data.names || []).map((n) => ({ name: n, look: null })));
    });
    es.addEventListener('move', (e) => {
      const { name, dir } = JSON.parse(e.data);
      const c = critters.get(name);
      if (!c) return;
      const STEP = 52;
      const now = performance.now();
      c.manualUntil = now + 8000;
      c.pauseUntil = now;
      c.speed = 240;
      if (dir === 'left') { c.tx = Math.max(0, c.x - STEP); c.ty = c.y; c.facing = -1; }
      if (dir === 'right') { c.tx = Math.min(Math.max(0, tank.clientWidth - c.w), c.x + STEP); c.ty = c.y; c.facing = 1; }
      if (dir === 'up') { c.ty = Math.max(0, c.y - STEP); c.tx = c.x; }
      if (dir === 'down') { c.ty = Math.min(Math.max(0, tank.clientHeight - c.h), c.y + STEP); c.tx = c.x; }
    });
    es.addEventListener('draw', (e) => {
      const { winner } = JSON.parse(e.data);
      runDraw(winner);
    });
    es.onerror = () => { es.close(); setTimeout(connect, 2000); };
  }
  connect();

  // --- the draw ---
  function showBig(name) {
    bignameEl.textContent = name;
    Clawd.drawVariant(bigcritter, Clawd.variantWithLook(name, looks.get(name)), 4);
  }

  function runDraw(winner) {
    if (drawing) return;
    drawing = true;
    overlay.classList.remove('landed');
    overlay.classList.add('show');
    statusEl.textContent = 'selecting winner';

    const pool = [...names].sort(() => Math.random() - 0.5);
    let i = 0;
    const start = performance.now();
    const DURATION = 4600;

    function tick(now) {
      const t = Math.min((now - start) / DURATION, 1);
      if (t >= 1) {
        showBig(winner);
        overlay.classList.add('landed');
        statusEl.textContent = 'winner';
        confettiBurst();
        drawing = false;
        return;
      }
      showBig(pool[i % pool.length]);
      i++;
      // ease-out: 45ms between swaps at the start → ~450ms at the end
      const delay = 45 + 405 * (t * t * t);
      setTimeout(() => requestAnimationFrame(tick), delay);
    }
    requestAnimationFrame(tick);
  }

  // --- confetti ---
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let confettiRunning = false;

  function confettiBurst() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    const colors = ['#d97757', '#e88b6a', '#ede6dc', '#9cae6e', '#c9a554'];
    for (let i = 0; i < 220; i++) {
      particles.push({
        x: innerWidth / 2 + (Math.random() - 0.5) * innerWidth * 0.4,
        y: innerHeight * 0.35,
        vx: (Math.random() - 0.5) * 16,
        vy: -6 - Math.random() * 12,
        size: 5 + Math.random() * 7,
        color: colors[i % colors.length],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
      });
    }
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiFrame); }
  }

  function confettiFrame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    particles = particles.filter(p => p.y < canvas.height + 40);
    if (particles.length) requestAnimationFrame(confettiFrame);
    else { confettiRunning = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }

  // --- controls ---
  let lastClear = 0;
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      if (drawing) return;
      fetch('/api/draw', { method: 'POST' });
    } else if (e.key === 'Escape') {
      overlay.classList.remove('show', 'landed');
    } else if (e.key === 'c' || e.key === 'C') {
      // press c twice within 1.5s to reset all entries
      const now = Date.now();
      if (now - lastClear < 1500) {
        fetch('/api/reset', { method: 'POST' });
        overlay.classList.remove('show', 'landed');
        lastClear = 0;
      } else {
        lastClear = now;
      }
    }
  });
</script>
</body>
